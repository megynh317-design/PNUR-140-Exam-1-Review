const drillBank = [
  // Chapter 3
  { ch: 3, stem: "A patient reports cyclic pelvic pain, dyspareunia, and painful bowel movements during menses that have progressively worsened over two years. This history is most consistent with:", options: ["Premenstrual syndrome", "Endometriosis", "Pelvic inflammatory disease", "An ovarian cyst"], correct: 1, rationale: "Progressive cyclic pain with dyspareunia and painful defecation during menses is the classic endometriosis triad — tissue growing outside the uterus responds to hormonal shifts and bleeds each cycle." },
  { ch: 3, stem: "A patient on combined oral contraceptives calls reporting a hot, swollen, tender area on her calf. What should the nurse advise?", options: ["This is a common, harmless side effect", "Ice and elevate, follow up in a week", "Seek immediate medical care today", "Stop the pill and restart next cycle"], correct: 2, rationale: "Calf warmth/swelling/tenderness on estrogen-containing contraceptives is an ACHES warning sign (severe leg pain) suggesting possible DVT — this requires urgent evaluation, not home management." },
  { ch: 3, stem: "A patient newly diagnosed with PCOS asks about long-term health risks. The nurse should include which risk in teaching?", options: ["Early ovarian failure", "Endometrial cancer from unopposed estrogen effects", "Primary hypothyroidism", "Osteoporosis"], correct: 1, rationale: "Chronic anovulation in PCOS means the endometrium is exposed to estrogen without the opposing effect of progesterone, raising long-term endometrial cancer risk." },
  { ch: 3, stem: "A patient starting the progestin-only \"minipill\" asks how to take it correctly. The nurse's best teaching is:", options: ["Take it with a 7-day placebo week like combined pills", "Take it at the same time every day with no placebo week", "Take it only on days of planned intercourse", "Skip the pill during the menstrual period"], correct: 1, rationale: "The minipill has no placebo week and must be taken at nearly the same time daily — timing inconsistency of even a few hours can result in contraceptive failure." },
  { ch: 3, stem: "A competitive distance runner reports no menstrual period for 8 months following a significant increase in training volume and weight loss. This is best described as:", options: ["Primary amenorrhea", "Secondary amenorrhea related to low body fat and energy availability", "Early-onset menopause", "PCOS-related anovulation"], correct: 1, rationale: "Secondary amenorrhea can result from excessive exercise and low body fat dropping below the threshold needed to sustain regular ovulation." },
  { ch: 3, stem: "A postmenopausal patient with an intact uterus asks why her provider prescribed progestin along with her estrogen therapy. The nurse's best response is:", options: ["\"Progestin controls hot flashes better than estrogen alone.\"", "\"Progestin protects your uterine lining from overgrowth caused by unopposed estrogen.\"", "\"Progestin prevents bone loss more effectively.\"", "\"Estrogen alone would raise your blood pressure.\""], correct: 1, rationale: "In a woman with a uterus, unopposed estrogen causes endometrial hyperplasia; progestin is added specifically to protect the endometrium." },

  // Chapter 4
  { ch: 4, stem: "Which fetal structure allows blood to bypass the fetal lungs almost entirely, shunting it from the pulmonary artery directly into the aorta?", options: ["Foramen ovale", "Ductus arteriosus", "Ductus venosus", "Umbilical vein"], correct: 1, rationale: "The ductus arteriosus shunts blood from the pulmonary artery to the aorta, bypassing the collapsed fetal lungs; the foramen ovale shunts right atrium to left atrium." },
  { ch: 4, stem: "A teratogen exposure at 8–9 weeks' gestation places the fetus at greatest risk for which type of defect?", options: ["Cardiac defect", "Neural tube defect", "Genitalia malformation", "Limb defect"], correct: 2, rationale: "The genitalia are most sensitive to teratogenic injury during weeks 8–9 of gestation, later than the critical periods for the heart (weeks 3–4) or neural tube." },
  { ch: 4, stem: "A patient pregnant with twins asks how twins that share one placenta but have two separate amniotic sacs are formed. The nurse explains this occurs when:", options: ["Two eggs are fertilized by two separate sperm", "A single fertilized egg splits during the blastocyst stage", "One egg is fertilized by two sperm", "An egg splits after implantation into the uterine wall"], correct: 1, rationale: "Monozygotic twins form from a single fertilized egg splitting; the timing of the split determines whether they share one or two amniotic sacs and/or placentas." },
  { ch: 4, stem: "Which hormone rises during the follicular phase and, once elevated enough, suppresses FSH and triggers the LH surge that causes ovulation?", options: ["Progesterone", "Estrogen", "Human chorionic gonadotropin", "Relaxin"], correct: 1, rationale: "Rising estrogen from the maturing follicle suppresses further FSH release and triggers the LH surge responsible for ovulation." },
  { ch: 4, stem: "Which fetal circulatory structure carries oxygenated, nutrient-rich blood from the placenta toward the fetus?", options: ["Umbilical arteries", "Umbilical vein", "Ductus arteriosus", "Chorionic villi alone, with no vessel involved"], correct: 1, rationale: "The single umbilical vein carries oxygenated blood from the placenta to the fetus; the two umbilical arteries return deoxygenated blood to the placenta." },
  { ch: 4, stem: "A patient asks how soon a blood test can detect pregnancy after conception. The nurse's best answer is approximately:", options: ["3 to 4 days", "7 to 8 days", "11 days", "3 weeks"], correct: 2, rationale: "Serum hCG is detectable by blood test about 11 days after conception, earlier than home urine testing, which typically requires 12–14 days." },

  // Chapter 5
  { ch: 5, stem: "A first-time pregnant patient asks when she will likely first feel fetal movement. The nurse's best answer is:", options: ["10 to 12 weeks", "18 to 21 weeks", "28 to 30 weeks", "32 to 34 weeks"], correct: 1, rationale: "Primigravidas typically first notice quickening between 18 and 21 weeks; women who have been pregnant before often notice it earlier." },
  { ch: 5, stem: "A patient at 30 weeks' gestation reports tingling and numbness in her thumb, index, and middle fingers. The nurse recognizes this is most likely caused by:", options: ["Vena cava compression from the gravid uterus", "Weight gain and edema compressing the median nerve", "Sciatic nerve compression", "Hypocalcemia"], correct: 1, rationale: "Pregnancy-related fluid retention and weight gain can compress the median nerve at the wrist, producing carpal tunnel-like symptoms in the thumb and first two fingers." },
  { ch: 5, stem: "Which finding is classified as a probable — not positive — sign of pregnancy?", options: ["Fetal heart tones auscultated by Doppler", "Ballottement of the fetus on pelvic exam", "Ultrasound visualization of the fetus", "Fetal movement felt by the examiner"], correct: 1, rationale: "Ballottement is a probable sign because it strongly suggests but does not confirm pregnancy on its own; positive signs (Doppler heart tones, ultrasound, examiner-felt movement) can be attributed only to an actual fetus." },
  { ch: 5, stem: "A pregnant patient in her second trimester says she is finally picking out a nursery theme and buying baby clothes. Per Rubin's maternal tasks, this behavior reflects:", options: ["Seeking safe passage for herself and the fetus", "Seeking acceptance of the child by others", "Binding-in / bonding with the infant", "Committing herself to the child through pregnancy"], correct: 3, rationale: "Preparing the nursery and accumulating baby items reflects Rubin's fourth maternal task — committing herself to the child as the pregnancy progresses." },
  { ch: 5, stem: "Which developmental factor most influences how a pregnant adolescent experiences and engages with prenatal care?", options: ["Fully developed abstract reasoning", "Egocentric thinking and a strong focus on peer relationships", "Complete lack of any abstract reasoning ability", "Total emotional independence from her family"], correct: 1, rationale: "Adolescent development is marked by egocentric thinking and peer-group importance, which shapes how a pregnant teen perceives normalcy, body image, and support needs." },
  { ch: 5, stem: "A patient's partner has gained 8 pounds and reports nausea despite making no dietary changes since learning of the pregnancy. The nurse recognizes this as:", options: ["Somatic symptom disorder", "Couvade syndrome", "An unrelated GI illness requiring workup", "Malingering for attention"], correct: 1, rationale: "Couvade syndrome describes a partner's sympathetic physical response (nausea, weight gain) to the pregnancy and is a recognized, benign phenomenon." },

  // Chapter 6
  { ch: 6, stem: "A patient is currently pregnant for the first time with no prior pregnancies of any kind. What is her correct GTPAL?", options: ["G0 T0 P0 A0 L0", "G1 T0 P0 A0 L0", "G1 T1 P0 A0 L0", "G0 T1 P0 A0 L1"], correct: 1, rationale: "The current pregnancy always counts toward G, so a first-ever pregnancy is G1, with all other categories at 0 since no birth or loss has occurred yet." },
  { ch: 6, stem: "A patient's last menstrual period began on June 5. Using Naegele's rule, what is her estimated date of delivery?", options: ["March 5", "March 12", "September 12", "April 12"], correct: 1, rationale: "Naegele's rule: subtract 3 months from the LMP (June 5 becomes March 5), then add 7 days, giving an EDD of March 12." },
  { ch: 6, stem: "Which first-trimester screening test uses ultrasound to measure fluid accumulation at the back of the fetal neck to screen for chromosomal abnormalities?", options: ["Quadruple screen", "Nuchal translucency testing", "Chorionic villus sampling only", "Amniocentesis"], correct: 1, rationale: "Nuchal translucency testing (NTT) measures nuchal fold fluid via ultrasound between 11–13 weeks to screen for chromosomal abnormalities such as trisomy 21." },
  { ch: 6, stem: "A patient's blood type is O-negative and her partner's Rh status is unknown. At what point in an uncomplicated pregnancy should the nurse anticipate RhoGAM administration?", options: ["At every prenatal visit", "At 28 weeks' gestation", "Only after delivery, never before", "Only if bleeding occurs"], correct: 1, rationale: "RhoGAM is routinely administered at 28 weeks' gestation to Rh-negative patients unless the father's Rh-negative status has been laboratory-confirmed." },
  { ch: 6, stem: "Which question is an appropriately worded way to screen a pregnant patient for intimate partner violence?", options: ["\"Your partner seems really protective — that's sweet, right?\"", "\"Do you feel safe at home?\"", "\"I'm sure everything is fine at home, correct?\"", "\"Are you sure you want me to ask you something personal?\""], correct: 1, rationale: "IPV screening should use direct, nonjudgmental, open questions such as \"Do you feel safe at home?\" rather than leading or minimizing language." },
  { ch: 6, stem: "A patient with an uncomplicated pregnancy is at 30 weeks' gestation. What is the expected frequency of her prenatal visits at this point?", options: ["Weekly", "Every 2 weeks", "Monthly", "Every 3 weeks"], correct: 1, rationale: "Visits occur monthly through 28 weeks, every 2 weeks from 28–36 weeks, and weekly after 36 weeks. At 30 weeks, the patient has moved into the every-2-weeks interval." },

  // Chapter 7
  { ch: 7, stem: "A pregnant patient reports strong cravings to chew on ice throughout the day. The nurse should assess this patient for which underlying condition?", options: ["Vitamin D deficiency", "Iron-deficiency anemia", "Hypocalcemia", "Folate deficiency"], correct: 1, rationale: "Pagophagia (ice craving) is a form of pica frequently associated with iron-deficiency anemia and warrants further nutritional assessment." },
  { ch: 7, stem: "Which finding reported by a pregnant patient is a normal discomfort requiring reassurance rather than provider notification?", options: ["Absence of fetal movement for the day", "Occasional round ligament pain with position changes", "Severe headache with visual changes", "Leaking fluid from the vagina"], correct: 1, rationale: "Round ligament pain is a common, benign discomfort of pregnancy; the other findings are warning signs requiring prompt provider notification." },
  { ch: 7, stem: "To reduce the risk of listeria exposure, the nurse should teach a pregnant patient to avoid which food unless it has been reheated to steaming hot?", options: ["Pasteurized milk", "Deli meats", "Cooked eggs", "Fresh whole fruit"], correct: 1, rationale: "Deli meats can harbor listeria after processing and should be avoided unless reheated to steaming hot immediately before eating." },
  { ch: 7, stem: "A same-sex couple's chart only has fields labeled \"mother\" and \"father.\" What is the nurse's best action?", options: ["Leave the nongestational partner's information blank", "Use gender-neutral language with the couple and advocate for updated documentation", "Ask the couple to complete the forms without staff involvement", "Avoid discussing the pregnancy with the nongestational partner"], correct: 1, rationale: "Culturally competent care includes using gender-neutral terms the couple prefers and advocating for inclusive documentation, rather than excluding a partner from care." },
  { ch: 7, stem: "A 36-year-old pregnant patient asks how her risk profile compares to a 25-year-old's. The nurse's best response includes:", options: ["\"There's no increased risk if you're otherwise healthy.\"", "\"You have an increased risk for chromosomal abnormalities and gestational complications.\"", "\"Your only increased risk is for twins.\"", "\"Your miscarriage risk is actually lower than a younger patient's.\""], correct: 1, rationale: "Advanced maternal age (over 35) is associated with increased risk for chromosomal abnormalities, miscarriage, and complications such as gestational hypertension and diabetes." },
  { ch: 7, stem: "A nonstress test at 34 weeks' gestation shows no qualifying accelerations after 40 minutes of monitoring. How should the nurse interpret this result?", options: ["Reactive — reassuring of fetal well-being", "A normal finding requiring no further action", "Nonreactive — requires further evaluation", "Positive — indicates immediate fetal distress requiring delivery"], correct: 2, rationale: "A tracing without sufficient qualifying accelerations after 40 minutes is nonreactive and requires further evaluation, such as a biophysical profile." },

  // Chapter 8
  { ch: 8, stem: "Which combination of laboratory findings is most consistent with HELLP syndrome?", options: ["Elevated platelets, low liver enzymes", "Low platelet count, elevated liver enzymes, evidence of hemolysis", "Elevated glucose with ketonuria", "Low hCG with high AFP"], correct: 1, rationale: "HELLP syndrome is named for its hallmark findings: Hemolysis, Elevated Liver enzymes, and Low Platelets." },
  { ch: 8, stem: "A patient receiving IV magnesium sulfate has a respiratory rate of 10/min and absent deep tendon reflexes. What is the nurse's priority action?", options: ["Increase the infusion rate to manage symptoms", "Stop the infusion and prepare to administer calcium gluconate", "Reposition the patient to her left side and recheck in an hour", "Administer an additional bolus dose as ordered"], correct: 1, rationale: "Respiratory depression and absent DTRs are signs of magnesium toxicity; the infusion should be stopped immediately and calcium gluconate (the antidote) prepared." },
  { ch: 8, stem: "Which presentation best differentiates placenta abruptio from placenta previa?", options: ["Painless, bright-red vaginal bleeding", "Painful bleeding with a tender, possibly board-like uterus", "Complete absence of any vaginal bleeding", "Fever with foul-smelling discharge"], correct: 1, rationale: "Placenta abruptio classically presents with pain and uterine tenderness (sometimes board-like rigidity), unlike the painless bleeding characteristic of placenta previa." },
  { ch: 8, stem: "Which risk factor is most strongly associated with the development of placenta accreta?", options: ["First pregnancy with no surgical history", "Prior cesarean delivery", "Young maternal age", "A strictly vegetarian diet"], correct: 1, rationale: "Uterine scarring from a prior cesarean delivery is a major risk factor for placenta accreta, as the placenta can attach abnormally deep into scarred myometrium." },
  { ch: 8, stem: "A pregnant patient with gestational diabetes reports feeling unwell. Which finding would NOT be expected if she is developing diabetic ketoacidosis (DKA)?", options: ["Fruity-smelling breath", "Rapid, deep (Kussmaul) respirations", "Cool, clammy skin", "Abdominal pain"], correct: 2, rationale: "DKA typically presents with warm, dry skin and dehydration — cool, clammy skin is more characteristic of hypoglycemia or shock, making it the near-miss distractor here." },

/* ================= NAEGELE GENERATOR ================= */
const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS_IN_MONTH = [31,28,31,30,31,30,31,31,30,31,30,31];

function fmt(m, d) { return `${MONTH_NAMES[m]} ${d}`; }

function addDays(month, day, days) {
  let m = month, d = day + days;
  while (d > DAYS_IN_MONTH[m]) { d -= DAYS_IN_MONTH[m]; m = (m + 1) % 12; }
  return { m, d };
}

function naegeleEDD(month, day) {
  const m = (month - 3 + 12) % 12; // subtract 3 months
  return addDays(m, day, 7);
}

function randomLMP() {
  const m = Math.floor(Math.random() * 12);
  const d = 1 + Math.floor(Math.random() * (DAYS_IN_MONTH[m] - 10)); // avoid tricky month-end overflow for readability
  return { m, d };
}

function generateNaegeleQuestion() {
  const lmp = randomLMP();
  const correct = naegeleEDD(lmp.m, lmp.d);
  const correctLabel = fmt(correct.m, correct.d);
  // distractors: forgot +7, added 7 without subtracting 3mo, subtracted only 2 months
  const noAdd = { m: (lmp.m - 3 + 12) % 12, d: lmp.d };
  const wrongMonth = { m: (lmp.m - 2 + 12) % 12, d: (lmp.d + 7) > DAYS_IN_MONTH[(lmp.m - 2 + 12) % 12] ? DAYS_IN_MONTH[(lmp.m - 2 + 12) % 12] : lmp.d + 7 };
  const addedNotSubtracted = addDays(lmp.m, lmp.d, 7);
  const options = [correctLabel, fmt(noAdd.m, noAdd.d), fmt(wrongMonth.m, wrongMonth.d), fmt(addedNotSubtracted.m, addedNotSubtracted.d)];
  // dedupe against correct, fallback distractor if collision
  const seen = new Set();
  const finalOpts = [];
  options.forEach(o => { if (!seen.has(o)) { seen.add(o); finalOpts.push(o); } });
  while (finalOpts.length < 4) {
    const fake = addDays(correct.m, correct.d, finalOpts.length * 3 + 2);
    const label = fmt(fake.m, fake.d);
    if (!seen.has(label)) { seen.add(label); finalOpts.push(label); }
  }
  // shuffle
  const shuffled = [...finalOpts].sort(() => Math.random() - 0.5);
  return {
    stem: `A patient's LMP began ${fmt(lmp.m, lmp.d)}. Using Naegele's rule, what is her estimated date of delivery?`,
    options: shuffled,
    correct: shuffled.indexOf(correctLabel),
    rationale: `Subtract 3 months from ${fmt(lmp.m, lmp.d)} (\u2192 ${fmt(noAdd.m, noAdd.d)}), then add 7 days \u2192 ${correctLabel}.`,
  };
}

function QuizRunner({ questions, onExit, modeLabel, modeIcon, studentName, category, detail }) {
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const [bestStreak, setBestStreak] = useState(0);
  const [missed, setMissed] = useState([]);
  const [done, setDone] = useState(false);
  const reported = useRef(false);

  const q = questions[idx];

  function choose(i) {
    if (revealed) return;
    setSelected(i);
    setRevealed(true);
    if (i === q.correct) {
      setScore(s => s + 1);
      setStreak(s => { const ns = s + 1; setBestStreak(b => Math.max(b, ns)); return ns; });
    } else {
      setStreak(0);
      setMissed(m => [...m, q]);
    }
  }

  function next() {
    if (idx + 1 >= questions.length) {
      if (!reported.current) { reported.current = true; postScore(studentName, category, detail, score, questions.length); }
      setDone(true);
      return;
    }
    setIdx(i => i + 1);
    setSelected(null);
    setRevealed(false);
  }

  if (done) {
    const pct = Math.round((score / questions.length) * 100);
    return (
      <div style={styles.card}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>

          <h2 style={styles.h2}>Round complete</h2>

        <p style={{ color: "#444", marginBottom: 18 }}>{modeLabel}</p>
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 20 }}>
          <StatBlock label="Score" value={`${score}/${questions.length}`} />
          <StatBlock label="Accuracy" value={`${pct}%`} />
          <StatBlock label="Best streak" value={bestStreak} />
        </div>
        {missed.length > 0 && (
          <div style={{ marginBottom: 20 }}>
            <h3 style={{ color: NAVY, fontSize: 16, marginBottom: 8, fontWeight: 700 }}>Review what you missed</h3>
            {missed.map((m, i) => (
              <div key={i} style={styles.reviewItem}>
                <p style={{ fontWeight: 600, color: NAVY_DEEP, marginBottom: 4 }}>{m.stem}</p>
                <p style={{ fontSize: 14, color: TEAL, marginBottom: 2 }}>Correct: {m.options[m.correct]}</p>
                <p style={{ fontSize: 13, color: "#555" }}>{m.rationale}</p>
              </div>
            ))}
          </div>
        )}
        {missed.length === 0 && (
          <p style={{ color: TEAL, fontWeight: 600, marginBottom: 20 }}>Clean sweep — nice work.</p>
        )}
        <div style={{ display: "flex", gap: 10 }}>
          <button style={styles.primaryBtn} onClick={onExit}><Home size={16} /> Back to menu</button>
        </div>
      </div>
    );
  }

  return (
    <div style={styles.card}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          {modeIcon}
          <span style={{ fontWeight: 700, color: NAVY, fontSize: 14 }}>{modeLabel}</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          {streak > 1 && (
            <span style={{ display: "flex", alignItems: "center", gap: 4, color: GOLD, fontWeight: 700, fontSize: 13 }}>
              <Flame size={15} /> {streak}
            </span>
          )}
          <span style={{ fontSize: 13, color: "#666" }}>{idx + 1} / {questions.length}</span>
        </div>
      </div>
      <ProgressBar value={idx} max={questions.length} />

      {q.ch && <div style={{ marginTop: 14 }}><Chip tone="teal">{chapterMeta[q.ch]?.label} · {chapterMeta[q.ch]?.title}</Chip></div>}

      <p style={{ fontSize: 17, color: NAVY_DEEP, lineHeight: 1.5, margin: "16px 0 18px", fontWeight: 500 }}>{q.stem}</p>

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {q.options.map((opt, i) => {
          let bg = "#fff", border = "#DAD5C6", color = NAVY_DEEP;
          if (revealed) {
            if (i === q.correct) { bg = "#E7F4EC"; border = TEAL; color = "#0B4F3F"; }

          return (

              textAlign: "left", padding: "12px 14px", borderRadius: 10, border: `1.5px solid ${border}`,
              background: bg, color, cursor: revealed ? "default" : "pointer", fontSize: 15,

            }}>
              <span>{opt}</span>

            </button>

      {revealed && (
        <div style={{ marginTop: 16, padding: "12px 14px", background: CREAM, borderRadius: 10, borderLeft: `4px solid ${GOLD}` }}>

// Left empty for the in-Claude preview (no network calls happen here — postScore silently
// no-ops). The standalone HTML build step replaces this with the real Apps Script /exec URL.
const SCORE_ENDPOINT = "https://script.google.com/macros/s/AKfycbzqkHWzGRRoJOfDpahATWdBY7oskKr5U5-8dLEX87xSejfrwgqFBKUiPYxWZD3dOt2BkQ/exec";

function postScore(studentName, category, detail, score, total) {
  if (!SCORE_ENDPOINT || !studentName) return;
  const accuracy = total > 0 ? Math.round((score / total) * 100) : 0;
  try {
    fetch(SCORE_ENDPOINT, {
      method: "POST",
      mode: "no-cors",
      body: new URLSearchParams({ name: studentName, category, detail: detail || "", score, total, accuracy }),
    }).catch(() => {});
  } catch (e) { /* silent — never block the UI on a logging failure */ }
}

/* ================= NAME GATE ================= */
function NameGate({ onSubmit }) {
  const [name, setName] = useState("");
  return (
    <div style={styles.card}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
        <HeartPulse size={24} color={GOLD} />
        <h2 style={styles.h2}>Before you start</h2>
      </div>
      <p style={{ color: "#5b584f", fontSize: 14, marginBottom: 18, lineHeight: 1.5 }}>
        Enter your name the way it appears in Canvas. Your instructor uses this to see which topics the class needs more review on — it isn't graded.
      </p>
      <input
        value={name}
        onChange={e => setName(e.target.value)}
        placeholder="First and last name"
        style={{ width: "100%", padding: "12px 14px", borderRadius: 10, border: "1.5px solid #DAD5C6", fontSize: 15, marginBottom: 16, fontFamily: "inherit" }}
        onKeyDown={e => { if (e.key === "Enter" && name.trim()) onSubmit(name.trim()); }}
      />
      <button
        style={{ ...styles.primaryBtn, opacity: name.trim() ? 1 : 0.5, cursor: name.trim() ? "pointer" : "not-allowed" }}
        disabled={!name.trim()}
        onClick={() => onSubmit(name.trim())}
      >
        Start reviewing <ChevronRight size={16} />
      </button>
    </div>
  );
}

function PNUR140Review() {
  const [screen, setScreen] = useState("gate"); // gate | home | quiz | showdown | naegele | math-select
  const [studentName, setStudentName] = useState("");
  const [activeQuestions, setActiveQuestions] = useState([]);
  const [modeLabel, setModeLabel] = useState("");
  const [modeIcon, setModeIcon] = useState(null);
  const [activeCategory, setActiveCategory] = useState("");
  const [activeDetail, setActiveDetail] = useState("");

  function startChapter(ch) {
    const pool = ch === "all" ? drillBank : drillBank.filter(q => q.ch === ch);
    setActiveQuestions(shuffle(pool));
    setModeLabel(ch === "all" ? "Full Mix — Chapters 3–8" : `${chapterMeta[ch].label} — ${chapterMeta[ch].title}`);
    setModeIcon(<Activity size={18} color={NAVY} />);
    setActiveCategory(ch === "all" ? "full-mix" : "chapter-drill");
    setActiveDetail(ch === "all" ? "" : String(ch));
    setScreen("quiz");
  }

  function startShowdown() {
    setActiveQuestions(shuffle(showdownBank));
    setModeLabel("Look-Alike Showdown");
    setModeIcon(<Swords size={18} color={NAVY} />);
    setActiveCategory("showdown");
    setActiveDetail("");
    setScreen("quiz");
  }

  function startGtpal() {
    setActiveQuestions(shuffle(gtpalBank));
    setModeLabel("Pregnancy Math Lab — GTPAL Practice");
    setModeIcon(<Calculator size={18} color={NAVY} />);
    setActiveCategory("gtpal");
    setActiveDetail("");
    setScreen("quiz");
  }

  function startWeightGain() {
    setActiveQuestions(shuffle(weightGainBank));
    setModeLabel("Pregnancy Math Lab — Weight Gain by BMI");
    setModeIcon(<Scale size={18} color={NAVY} />);
    setActiveCategory("weight-gain");
    setActiveDetail("");
    setScreen("quiz");
  }

  return (
    <div style={{ fontFamily: "'Calibri','Segoe UI',system-ui,sans-serif", background: CREAM, minHeight: "100%", padding: "28px 18px" }}>
      <div style={{ maxWidth: 720, margin: "0 auto" }}>
        <header style={{ textAlign: "center", marginBottom: 26 }}>
          <div style={{ display: "inline-flex", alignItems: "center", gap: 8, background: NAVY, color: "#fff", padding: "6px 14px", borderRadius: 999, fontSize: 12, fontWeight: 700, letterSpacing: 0.6, marginBottom: 12 }}>
            <HeartPulse size={14} /> PNUR 140 · EXAM 1 PREP
          </div>
          <h1 style={{ margin: "0 0 6px", fontSize: 30, color: NAVY_DEEP, fontWeight: 800 }}>The Differential</h1>
          <p style={{ margin: 0, color: "#6b675c", fontSize: 15 }}>Care of the Developing Family — Chapters 3–8</p>
          {screen !== "gate" && studentName && (
            <p style={{ margin: "10px 0 0", fontSize: 12, color: "#9a9686" }}>
              Signed in as {studentName} · <button onClick={() => setScreen("gate")} style={{ background: "none", border: "none", padding: 0, color: TEAL, fontWeight: 700, cursor: "pointer", fontSize: 12, textDecoration: "underline" }}>not you?</button>
            </p>
          )}
        </header>

        {screen === "gate" && (
          <NameGate onSubmit={(n) => { setStudentName(n); setScreen("home"); }} />
        )}

        {screen === "home" && (
          <>
            <p style={{ textAlign: "center", color: "#5b584f", fontSize: 14, marginBottom: 22, lineHeight: 1.6 }}>
              This exam rewards telling apart conditions that look alike — not just recall. Pick a mode below.
            </p>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 22 }}>
              <ModeCard icon={<Swords size={22} color="#fff" />} accent={NAVY} title="Look-Alike Showdown" desc="10 head-to-head calls: previa vs. abruption, PMS vs. PMDD, DKA vs. hypoglycemia, and more." meta="10 rounds" onClick={startShowdown} />
              <ModeCard icon={<CalendarClock size={22} color="#fff" />} accent={TEAL} title="Pregnancy Math Lab" desc="Naegele's rule, GTPAL, and weight-gain-by-BMI — the calculation skills the exam tests directly." meta="3 drills" onClick={() => setScreen("math-select")} />
            </div>

            <h2 style={{ fontSize: 15, fontWeight: 800, color: NAVY, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 10 }}>Chapter Drill</h2>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
              {[3,4,5,6,7,8].map(ch => (
                <button key={ch} onClick={() => startChapter(ch)} style={{
                  textAlign: "left", background: "#fff", border: "1.5px solid #E4E0D3", borderRadius: 12,
                  padding: "14px 16px", cursor: "pointer"
                }}
                  onMouseEnter={e => e.currentTarget.style.borderColor = TEAL}
                  onMouseLeave={e => e.currentTarget.style.borderColor = "#E4E0D3"}
                >
                  <div style={{ fontSize: 12, fontWeight: 800, color: GOLD, marginBottom: 2 }}>{chapterMeta[ch].label}</div>
                  <div style={{ fontSize: 14, fontWeight: 700, color: NAVY_DEEP }}>{chapterMeta[ch].title}</div>
                  <div style={{ fontSize: 12, color: "#888", marginTop: 4 }}>6 questions</div>
                </button>
              ))}
            </div>
            <button onClick={() => startChapter("all")} style={{
              width: "100%", padding: "14px 16px", borderRadius: 12, border: "none",
              background: `linear-gradient(90deg, ${NAVY}, ${TEAL})`, color: "#fff", fontWeight: 800, fontSize: 15, cursor: "pointer"
            }}>Full Mix — all 36 questions, shuffled</button>
          </>
        )}

        {screen === "quiz" && (
          <QuizRunner questions={activeQuestions} onExit={() => setScreen("home")} modeLabel={modeLabel} modeIcon={modeIcon} studentName={studentName} category={activeCategory} detail={activeDetail} />
        )}

        {screen === "naegele" && <NaegeleLab onExit={() => setScreen("home")} studentName={studentName} />}

        {screen === "math-select" && (
          <div style={styles.card}>
            <button onClick={() => setScreen("home")} style={{ ...styles.ghostBtn, display: "inline-flex", alignItems: "center", gap: 6, marginBottom: 18, padding: "8px 14px" }}>
              <ArrowLeft size={15} /> Back
            </button>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
              <CalendarClock size={24} color={GOLD} />
              <h2 style={styles.h2}>Pregnancy Math Lab</h2>
            </div>
            <p style={{ color: "#5b584f", fontSize: 14, marginBottom: 20 }}>Three drills, three calculations. Pick one.</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              <MathOption icon={<CalendarClock size={20} color="#fff" />} accent={TEAL} title="Naegele's Rule" desc="Unlimited randomly generated LMP → EDD problems." meta="Endless" onClick={() => setScreen("naegele")} />
              <MathOption icon={<Calculator size={20} color="#fff" />} accent={NAVY} title="GTPAL Practice" desc="Work through pregnancy histories and calculate G, T, P, A, L." meta="8 rounds" onClick={startGtpal} />
              <MathOption icon={<Scale size={20} color="#fff" />} accent={GOLD} title="Weight Gain by BMI" desc="Match prepregnancy BMI to the correct recommended weight-gain range." meta="6 rounds" onClick={startWeightGain} />
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const styles = {
  card: { background: "#fff", borderRadius: 18, padding: 24, boxShadow: "0 2px 10px rgba(27,58,107,0.08)", border: "1px solid #ECE8DA" },
  h2: { margin: 0, color: NAVY_DEEP, fontSize: 22, fontWeight: 800 },
  primaryBtn: { display: "flex", alignItems: "center", gap: 6, background: NAVY, color: "#fff", border: "none", padding: "11px 18px", borderRadius: 10, fontWeight: 700, fontSize: 14, cursor: "pointer" },
  ghostBtn: { background: "transparent", color: "#8a8676", border: "1.5px solid #DAD5C6", padding: "11px 18px", borderRadius: 10, fontWeight: 700, fontSize: 14, cursor: "pointer" },
  reviewItem: { padding: "12px 0", borderBottom: "1px solid #EEEAdd" },
};


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(PNUR140Review));
</script>
</body>
</html>
